# llm-doc-lint config — see `llm-doc-lint --help`
# Skip linting if repo has been idle longer than this (hours)
IDLE_AFTER_HOURS=2

# Index files (basenames or globs at repo root). Design docs are "covered"
# when their filename appears in any of these.
INDEX_FILES="README.md CLAUDE.md INDEX.md *-Index.md"

# Patterns for files treated as design docs (find -name patterns; recursive)
DOC_PATTERNS="*-Design.md *-Spec.md DESIGN.md SPEC.md ARCHITECTURE.md"

# Top-level files that should NOT be flagged as sprawl
TOP_LEVEL_ALLOWLIST="README.md CLAUDE.md AGENTS.md LICENSE LICENSE.md CHANGELOG.md NOTES.md TODO.md ROADMAP.md"

# Code dirs to compare doc freshness against (blank = auto-detect)
CODE_DIRS=""

# A doc older than this many days while code is active is flagged stale
DOC_STALE_DAYS=30

# Code is "active" if any file in CODE_DIRS changed within this many days
CODE_ACTIVE_DAYS=7
